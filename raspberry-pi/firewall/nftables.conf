#!/usr/sbin/nft -f
# =====================================================================
# SecureHome SOC — Raspberry Pi firewall (nftables)
# Default-deny inbound, stateful, with logging of dropped packets so
# the drops also show up in the SOC dashboard.
# Apply:  sudo nft -f /etc/nftables.conf
# =====================================================================

flush ruleset

table inet filter {

    # ----- sets you can grow over time -----
    set blocklist_v4 {
        type ipv4_addr
        flags interval
        # auto-populated by fail2ban / scripts, or add manually:
        # elements = { 203.0.113.66, 198.51.100.0/24 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # loopback + established/related
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # drop anything from the blocklist (and log it)
        ip saddr @blocklist_v4 log prefix "NFT-BLOCKLIST-DROP " drop

        # ICMP (ping) — handy for the lab; rate-limited
        ip protocol icmp icmp type echo-request limit rate 5/second accept

        # management services — restrict to your admin subnet only
        ip saddr 10.10.99.0/24 tcp dport 22 accept      # SSH admin
        ip saddr 10.10.99.0/24 tcp dport 3000 accept    # Grafana admin

        # everything else inbound is logged then dropped
        log prefix "NFT-INPUT-DROP " limit rate 10/second
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # If running INLINE (Pi as gateway), allow LAN->WAN, drop the rest.
        ct state established,related accept
        iifname "eth1" oifname "eth0" accept   # LAN out to WAN (edit ifaces)
        log prefix "NFT-FWD-DROP " limit rate 10/second
        counter drop
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
