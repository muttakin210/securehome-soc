! =====================================================================
! SW1 — Core L3 Switch  (IOSvL2 / vIOS-L2 in GNS3)
! Role: VLANs, SVIs (inter-VLAN routing), segmentation ACLs, OSPF
! This is the heart of the "segmentation" story in the demo.
! =====================================================================

hostname SW1
no ip domain-lookup
ip routing                      ! enable L3 switching / inter-VLAN routing
!
username admin privilege 15 secret Str0ng-Admin!
enable secret Str0ng-Enable!
!
! =====================================================================
! VLAN definitions
! =====================================================================
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name IoT
vlan 99
 name MGMT
exit
!
! =====================================================================
! Trunks
! =====================================================================
interface GigabitEthernet0/1
 description Trunk to R1 (edge)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
exit
interface GigabitEthernet0/2
 description Trunk to SW2 (access switch)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
exit
!
! =====================================================================
! SVIs = the default gateway for each VLAN
! =====================================================================
interface Vlan10
 description USERS gateway
 ip address 10.10.10.1 255.255.255.0
 ip access-group USERS-IN in
 no shutdown
exit
interface Vlan20
 description SERVERS gateway
 ip address 10.10.20.1 255.255.255.0
 ip access-group SERVERS-IN in
 no shutdown
exit
interface Vlan30
 description IoT gateway (UNTRUSTED)
 ip address 10.10.30.1 255.255.255.0
 ip access-group IoT-IN in
 no shutdown
exit
interface Vlan99
 description MGMT gateway + P2P to R1
 ip address 10.10.99.1 255.255.255.0
 no shutdown
exit
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
exit
!
! =====================================================================
! OSPF to R1 so all zones reach the internet
! =====================================================================
router ospf 1
 router-id 2.2.2.2
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
exit
!
! =====================================================================
! SEGMENTATION ACLs  <-- the control the demo PROVES
! Applied inbound on each SVI (filters traffic as it ENTERS that VLAN)
! =====================================================================
!
! --- IoT: internet only, NOTHING internal. This is the key rule. ---
ip access-list extended IoT-IN
 remark Allow DNS + web to the internet, block all internal (RFC1918)
 permit udp 10.10.30.0 0.0.0.255 any eq 53
 permit tcp 10.10.30.0 0.0.0.255 any eq 53
 permit tcp 10.10.30.0 0.0.0.255 any eq 80
 permit tcp 10.10.30.0 0.0.0.255 any eq 443
 deny   ip  10.10.30.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny   ip  10.10.30.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny   ip  10.10.30.0 0.0.0.255 192.168.0.0 0.0.255.255
 permit ip  10.10.30.0 0.0.0.255 any
exit
!
! --- USERS: reach SERVERS only on ssh(22)/http(80)/https(443), else internet ---
ip access-list extended USERS-IN
 permit tcp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 22
 permit tcp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 80
 permit tcp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 443
 permit udp 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 eq 53
 deny   ip  10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255
 deny   ip  10.10.10.0 0.0.0.255 10.10.30.0 0.0.0.255
 permit ip  10.10.10.0 0.0.0.255 any
exit
!
! --- SERVERS: allow replies + internet (updates), block initiating into USERS/IoT ---
ip access-list extended SERVERS-IN
 permit tcp 10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255 established
 deny   ip  10.10.20.0 0.0.0.255 10.10.10.0 0.0.0.255
 deny   ip  10.10.20.0 0.0.0.255 10.10.30.0 0.0.0.255
 permit ip  10.10.20.0 0.0.0.255 any
exit
!
! =====================================================================
! Hardening
! =====================================================================
service password-encryption
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
exit
!
! --- Port security example on an access-facing idea (optional) ---
! (access ports live on SW2; see SW2-access.cfg)
!
end
! write memory
!
! ---------------------------------------------------------------------
! LOW-RAM ALTERNATIVE (router-on-a-stick, no L3 switch needed):
! If you cannot run IOSvL2, do inter-VLAN routing on R1 instead:
!   interface Gi0/1.10 / .20 / .30  with 'encapsulation dot1Q <vlan>'
!   put the SVI IPs + 'ip access-group' lines on those subinterfaces,
!   and make SW1 a plain L2 switch. Same ACLs, same demo.
! ---------------------------------------------------------------------
