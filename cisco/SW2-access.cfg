! =====================================================================
! SW2 — Access Switch  (IOSvL2 / vIOS-L2 in GNS3)
! Role: puts end devices into the right VLAN; L2 hardening
! =====================================================================

hostname SW2
no ip domain-lookup
!
username admin privilege 15 secret Str0ng-Admin!
enable secret Str0ng-Enable!
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name IoT
vlan 99
 name MGMT
exit
!
! --- Uplink trunk to SW1 ---
interface GigabitEthernet0/1
 description Uplink trunk to SW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,99
exit
!
! =====================================================================
! Access ports — one device per port, each pinned to its VLAN
! Port security limits MAC addresses (shows L2 hardening)
! =====================================================================
interface GigabitEthernet0/2
 description Kali (attacker) - USERS
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
interface GigabitEthernet0/3
 description Ubuntu target server - SERVERS
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
interface GigabitEthernet0/4
 description IoT device - IoT (untrusted)
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
!
! --- Shut unused ports (good hygiene to mention in interview) ---
interface range GigabitEthernet0/5 - 7
 description UNUSED - disabled
 shutdown
exit
!
! --- Management SVI so you can SSH to the switch ---
interface Vlan99
 ip address 10.10.99.12 255.255.255.0
 no shutdown
exit
ip default-gateway 10.10.99.1
!
service password-encryption
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
exit
!
end
! write memory
