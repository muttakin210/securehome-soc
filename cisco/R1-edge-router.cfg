! =====================================================================
! R1 — Edge Router  (IOSv / c7200 in GNS3)
! Role: WAN edge, NAT/PAT overload, OSPF with SW1
! Paste into the device after 'enable' + 'configure terminal'
! =====================================================================

hostname R1
!
no ip domain-lookup
ip domain-name securehome.lab
!
! --- Local admin (lab only; change in real use) ---
username admin privilege 15 secret Str0ng-Admin!
enable secret Str0ng-Enable!
!
! --- SSH management (shows you secure device access) ---
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
exit
!
! =====================================================================
! WAN interface (outside) — DHCP from the Pi/home network, NAT outside
! =====================================================================
interface GigabitEthernet0/0
 description WAN to Internet (via Raspberry Pi)
 ip address dhcp
 ip nat outside
 no shutdown
exit
!
! =====================================================================
! LAN trunk to SW1 — subinterfaces are NAT inside
! (We route via the SVIs on SW1; R1 reaches them over OSPF.)
! =====================================================================
interface GigabitEthernet0/1
 description Trunk to SW1 (OSPF + NAT inside)
 no ip address
 ip nat inside
 no shutdown
exit
interface GigabitEthernet0/1.1
 description P2P link to SW1 for routing
 encapsulation dot1Q 99
 ip address 10.10.99.254 255.255.255.0
 ip nat inside
exit
!
! --- Loopback for a stable OSPF router-id ---
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
exit
!
! =====================================================================
! OSPF — area 0 only (keep it simple, show dynamic routing)
! =====================================================================
router ospf 1
 router-id 1.1.1.1
 network 10.10.99.0 0.0.0.255 area 0
 default-information originate
exit
!
! Default route out the WAN (DHCP usually installs one; explicit here)
! ip route 0.0.0.0 0.0.0.0 GigabitEthernet0/0
!
! =====================================================================
! NAT / PAT — overload all internal 10.10.0.0/16 behind the WAN IP
! =====================================================================
ip access-list standard NAT-INSIDE
 permit 10.10.0.0 0.0.255.255
exit
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0 overload
!
! =====================================================================
! Basic hardening
! =====================================================================
service password-encryption
no ip http server
no ip http secure-server
login block-for 60 attempts 5 within 30
!
end
! write memory   <-- run this to save
